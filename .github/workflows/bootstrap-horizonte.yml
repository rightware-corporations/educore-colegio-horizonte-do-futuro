name: Bootstrap Horizonte EduCore base

on:
  push:
    paths:
      - ".github/workflows/bootstrap-horizonte.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Import EduCore base without external actions
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/target

          git clone --depth 1 --branch tenant/colegio-pascoa-live \
            "https://github.com/aevumlux1-rwbot/educore.v1.1.git" \
            /tmp/source

          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            /tmp/source/ /tmp/target/

          cd /tmp/target

          mkdir -p docs
          cat > docs/HORIZONTE_MVP_BOOTSTRAP.md <<'EOF'
# EduCore — Colégio Horizonte do Futuro — MVP Bootstrap

This repository is an isolated commercial MVP project for Colégio Horizonte do Futuro.

## Operating model

- one school;
- one repository;
- one production branch;
- one deployment;
- one domain.

The imported Colégio Páscoa branding, assets, hostname rules and metadata are temporary bootstrap material only and must be replaced before deployment or presentation.

Preserve the internal EduCore system. Focus the MVP adaptation on the public landing, school identity, real media, metadata/favicon and visual continuity into login.
EOF

          rm -f .github/workflows/bootstrap-horizonte.yml

          git config user.name "RIGHTWARE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap EduCore foundation for Colégio Horizonte do Futuro"
          git push origin HEAD:main
